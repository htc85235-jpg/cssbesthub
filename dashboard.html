<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#eef0f5" />
<title>POAT Dashboard — Emergency Call Receiver</title>
<link rel="icon" href="/cssbesthub/logo.svg" />
<link rel="apple-touch-icon" href="/cssbesthub/logo.svg" />

<!-- ===== Dependencies (same as Secret Call Box) ===== -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ===================================================================
   POAT DASHBOARD — WHITE NEUMORPHISM UI (matches Secret Call Box)
   Background: #eef0f5
   Text: blue #1d4ed8 with glow
   Extruded shadows: 5px 5px 10px rgba(163,177,198,.55), -5px -5px 10px rgba(255,255,255,.9)
   Inset shadows:    inset 4px 4px 8px rgba(163,177,198,.6), inset -4px -4px 8px rgba(255,255,255,.9)
   =================================================================== */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  min-height: 100vh;
  background: #eef0f5;
  font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: #1d4ed8;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

/* ===== STAGE / CARD ===== */
.stage {
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  position: relative;
  background: #eef0f5;
  border-radius: 28px;
  padding: 28px 24px 22px;
  width: 100%;
  text-align: center;
  box-shadow:
    9px 9px 18px rgba(163, 177, 198, 0.6),
    -9px -9px 18px rgba(255, 255, 255, 0.9);
  border: none;
}

/* ===== HEADER ===== */
.header {
  margin-bottom: 22px;
}

.header .logo-badge {
  width: 64px;
  height: 64px;
  margin: 0 auto 14px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eef0f5;
  font-size: 26px;
  box-shadow:
    inset 3px 3px 6px rgba(163, 177, 198, 0.55),
    inset -3px -3px 6px rgba(255, 255, 255, 0.95);
  text-shadow: none;
}

.header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.header p {
  font-size: 12px;
  letter-spacing: 1px;
  opacity: 0.75;
  text-transform: uppercase;
  font-weight: 500;
}

/* ===== INPUTS ===== */
.input-wrap {
  margin-bottom: 14px;
  text-align: left;
}

.input-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: #1d4ed8;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 6px;
  margin-left: 4px;
  opacity: 0.7;
}

.input {
  width: 100%;
  background: #eef0f5;
  border: none;
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 14px;
  color: #1d4ed8;
  letter-spacing: 0.5px;
  outline: none;
  font-family: 'JetBrains Mono', monospace;
  box-shadow:
    inset 4px 4px 8px rgba(163, 177, 198, 0.55),
    inset -4px -4px 8px rgba(255, 255, 255, 0.9);
}

.input::placeholder {
  color: rgba(37, 99, 235, 0.4);
  text-shadow: none;
  font-family: 'Space Grotesk', sans-serif;
}

.input:focus {
  box-shadow:
    inset 4px 4px 8px rgba(163, 177, 198, 0.65),
    inset -4px -4px 8px rgba(255, 255, 255, 0.9);
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.8px;
  cursor: pointer;
  outline: none;
  background: #eef0f5;
  color: #1d4ed8;
  font-family: inherit;
  box-shadow:
    5px 5px 10px rgba(163, 177, 198, 0.55),
    -5px -5px 10px rgba(255, 255, 255, 0.9);
  transition: color 0.15s;
  width: 100%;
  margin-bottom: 10px;
}

.btn:last-child { margin-bottom: 0; }

.btn i { font-size: 13px; }

.btn:hover {
  color: #2563eb;
}

.btn:active {
  box-shadow:
    inset 4px 4px 8px rgba(163, 177, 198, 0.6),
    inset -4px -4px 8px rgba(255, 255, 255, 0.9);
  color: #2563eb;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow:
    inset 2px 2px 5px rgba(163, 177, 198, 0.4),
    inset -2px -2px 5px rgba(255, 255, 255, 0.8);
}

.btn-ghost {
  background: #eef0f5;
  font-size: 12px;
  padding: 10px 14px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ===== STATUS DOT ===== */
.status-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 16px;
  margin: 14px 0 18px;
  border-radius: 14px;
  font-size: 12px;
  letter-spacing: 1px;
  font-weight: 600;
  text-transform: uppercase;
  background: #eef0f5;
  box-shadow:
    inset 2px 2px 5px rgba(163, 177, 198, 0.4),
    inset -2px -2px 5px rgba(255, 255, 255, 0.85);
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #1d4ed8;
  box-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
  animation: dotPulse 1.6s ease-in-out infinite;
}

.status-dot.sc-busy { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.8); }
.status-dot.sc-ok   { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.8); }
.status-dot.sc-err  { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.8); }

@keyframes dotPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.8); }
}

/* ===== INFO BOX ===== */
.info-box {
  font-size: 11px;
  letter-spacing: 0.8px;
  padding: 10px 12px;
  border-radius: 10px;
  margin-top: 14px;
  line-height: 1.6;
  background: #eef0f5;
  opacity: 0.7;
  box-shadow:
    inset 2px 2px 4px rgba(163, 177, 198, 0.3),
    inset -2px -2px 4px rgba(255, 255, 255, 0.8);
}

.info-box code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0;
  word-break: break-all;
}

/* ===== SCREEN SWITCHING ===== */
.screen { display: none; }
.screen.sc-active { display: block; }

/* ===== INCOMING CALL OVERLAY ===== */
#incoming-overlay {
  position: fixed;
  inset: 0;
  z-index: 2147483647;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(238, 240, 245, 0.96);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  padding: 16px;
  animation: overlayFadeIn 0.3s ease;
}

#incoming-overlay.sc-open { display: flex; }

@keyframes overlayFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.incoming-card {
  position: relative;
  background: #eef0f5;
  border-radius: 32px;
  padding: 36px 24px 30px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow:
    12px 12px 24px rgba(163, 177, 198, 0.65),
    -12px -12px 24px rgba(255, 255, 255, 0.95);
  animation: cardSlideUp 0.4s cubic-bezier(0.2, 0.8, 0.3, 1);
}

@keyframes cardSlideUp {
  from { transform: translateY(20px) scale(0.95); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

/* Animated caller avatar (neumorphic pulsing circle) */
.caller-avatar {
  width: 110px;
  height: 110px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: #eef0f5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  color: #1d4ed8;
  position: relative;
  box-shadow:
    6px 6px 14px rgba(163, 177, 198, 0.6),
    -6px -6px 14px rgba(255, 255, 255, 0.95),
    inset 0 0 0 0 rgba(59, 130, 246, 0);
  animation: avatarPulse 1.4s ease-in-out infinite;
}

.caller-avatar::before,
.caller-avatar::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 2px solid rgba(59, 130, 246, 0.25);
  animation: ringRipple 1.8s ease-out infinite;
}

.caller-avatar::after { animation-delay: 0.9s; }

@keyframes avatarPulse {
  0%, 100% {
    box-shadow:
      6px 6px 14px rgba(163, 177, 198, 0.6),
      -6px -6px 14px rgba(255, 255, 255, 0.95),
      0 0 0 0 rgba(59, 130, 246, 0.4);
  }
  50% {
    box-shadow:
      6px 6px 14px rgba(163, 177, 198, 0.6),
      -6px -6px 14px rgba(255, 255, 255, 0.95),
      0 0 0 14px rgba(59, 130, 246, 0);
  }
}

@keyframes ringRipple {
  0%   { transform: scale(0.9); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

.incoming-card h2 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.incoming-card .caller-name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
  color: #2563eb;
}

.incoming-card .caller-source {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 28px;
}

/* Big circular Answer / Decline buttons */
.call-actions {
  display: flex;
  justify-content: space-around;
  align-items: center;
  gap: 30px;
  margin-top: 8px;
}

.call-action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.call-action-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: none;
  background: #eef0f5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  outline: none;
  font-family: inherit;
  box-shadow:
    6px 6px 12px rgba(163, 177, 198, 0.55),
    -6px -6px 12px rgba(255, 255, 255, 0.95);
  transition: all 0.15s;
}

.call-action-btn:active {
  box-shadow:
    inset 4px 4px 10px rgba(163, 177, 198, 0.6),
    inset -4px -4px 10px rgba(255, 255, 255, 0.9);
}

.call-action-btn.answer {
  color: #10b981;
  animation: answerPulse 1.2s ease-in-out infinite;
}

.call-action-btn.decline {
  color: #ef4444;
}

@keyframes answerPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.06); }
}

.call-action-label {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  opacity: 0.7;
}

/* ===== IN-CALL SCREEN ===== */
.incall-timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 4px;
  margin: 16px 0 8px;
  color: #2563eb;
}

.incall-status {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 22px;
}

.incall-controls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-top: 10px;
}

.ctrl-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 8px;
  border: none;
  border-radius: 16px;
  background: #eef0f5;
  color: #1d4ed8;
  cursor: pointer;
  outline: none;
  font-family: inherit;
  box-shadow:
    5px 5px 10px rgba(163, 177, 198, 0.5),
    -5px -5px 10px rgba(255, 255, 255, 0.9);
  transition: all 0.15s;
}

.ctrl-btn i { font-size: 18px; }

.ctrl-btn span {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 600;
}

.ctrl-btn:active,
.ctrl-btn.sc-active {
  box-shadow:
    inset 4px 4px 8px rgba(163, 177, 198, 0.6),
    inset -4px -4px 8px rgba(255, 255, 255, 0.9);
  color: #2563eb;
}

.ctrl-btn.hangup {
  color: #ef4444;
}

.ctrl-btn.hangup:active {
  color: #dc2626;
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(40px);
  background: #eef0f5;
  color: #1d4ed8;
  padding: 12px 20px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
  box-shadow:
    5px 5px 12px rgba(163, 177, 198, 0.55),
    -5px -5px 12px rgba(255, 255, 255, 0.9);
  max-width: 90%;
  text-align: center;
}

.toast.sc-show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.sc-err  { color: #ef4444; }
.toast.sc-ok   { color: #10b981; }

/* ===== UTILITY ===== */
.hidden { display: none !important; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* Inline "test call" link in idle screen */
.test-link {
  display: inline-block;
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
  opacity: 0.7;
  text-decoration: underline;
  cursor: pointer;
  padding: 4px 8px;
}

.test-link:hover { opacity: 1; }

/* Audio element hidden */
audio { display: none; }
</style>
</head>
<body>

<!-- Hidden remote audio element for the call -->
<audio id="remote-audio" autoplay playsinline></audio>

<div class="stage">
  <div class="card">

    <!-- ============== SCREEN 1: LOGIN ============== -->
    <div class="screen sc-active" id="screen-login">
      <div class="header">
        <div class="logo-badge"><i class="fas fa-shield-halved"></i></div>
        <h1>POAT Dashboard</h1>
        <p>Emergency Call Receiver</p>
      </div>

      <div class="input-wrap">
        <div class="input-label">Device ID</div>
        <input type="text" class="input" id="login-device-id" placeholder="Enter Device ID" autocomplete="off" />
      </div>

      <button class="btn" id="btn-login">
        <i class="fas fa-arrow-right-to-bracket"></i> Connect
      </button>
    </div>

    <!-- ============== SCREEN 2: IDLE / LISTENING ============== -->
    <div class="screen" id="screen-idle">
      <div class="header">
        <div class="logo-badge"><i class="fas fa-tower-broadcast"></i></div>
        <h1>POAT Dashboard</h1>
        <p>Listening</p>
      </div>

      <div class="status-row" id="idle-status">
        <div class="status-dot sc-ok" id="idle-dot"></div>
        <span id="idle-status-text">Listening for calls</span>
      </div>

      <div class="info-box">
        Device ID:<br/>
        <code id="idle-device-id">—</code>
      </div>

      <div class="info-box" style="margin-top: 8px;">
        Last poll: <span class="mono" id="idle-last-poll">never</span><br/>
        Calls received: <span class="mono" id="idle-call-count">0</span>
      </div>

      <button class="btn" id="btn-test-call" style="margin-top: 14px;">
        <i class="fas fa-vial"></i> Test Ringtone
      </button>

      <button class="btn btn-ghost" id="btn-logout">
        <i class="fas fa-arrow-right-from-bracket"></i> Disconnect
      </button>
    </div>

    <!-- ============== SCREEN 3: IN-CALL ============== -->
    <div class="screen" id="screen-incall">
      <div class="header">
        <div class="logo-badge" style="color: #10b981;"><i class="fas fa-phone-volume"></i></div>
        <h1>In Call</h1>
        <p id="incall-caller">Unknown</p>
      </div>

      <div class="incall-timer" id="incall-timer">00:00</div>
      <div class="incall-status" id="incall-status">Connected</div>

      <div class="incall-controls">
        <button class="ctrl-btn" id="btn-mute">
          <i class="fas fa-microphone"></i>
          <span>Mute</span>
        </button>
        <button class="ctrl-btn" id="btn-speaker">
          <i class="fas fa-volume-high"></i>
          <span>Speaker</span>
        </button>
        <button class="ctrl-btn hangup" id="btn-hangup">
          <i class="fas fa-phone-slash"></i>
          <span>Hangup</span>
        </button>
      </div>
    </div>

  </div>
</div>

<!-- ============== INCOMING CALL OVERLAY ============== -->
<div id="incoming-overlay">
  <div class="incoming-card">
    <div class="caller-avatar"><i class="fas fa-phone-volume"></i></div>
    <h2>Incoming Call POAT</h2>
    <div class="caller-name" id="incoming-caller-name">Website Caller</div>
    <div class="caller-source">From CSS Guide Website</div>

    <div class="call-actions">
      <div class="call-action" id="action-decline">
        <button class="call-action-btn decline" type="button" aria-label="Decline">
          <i class="fas fa-phone-slash"></i>
        </button>
        <div class="call-action-label">Decline</div>
      </div>
      <div class="call-action" id="action-answer">
        <button class="call-action-btn answer" type="button" aria-label="Answer">
          <i class="fas fa-phone"></i>
        </button>
        <div class="call-action-label">Answer</div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   POAT DASHBOARD — Logic
   =================================================================== */

// ---- Config ----
var BACKEND_URL = 'https://emergency-backend-eight.vercel.app';
var POLL_INTERVAL_MS = 2000;       // poll every 2 seconds
var POLL_TIMEOUT_MS  = 8000;       // hard timeout per poll
var HEARTBEAT_INTERVAL_MS = 60000; // refresh device status every 60s
var VIBRATION_PATTERN = [0, 1000, 400, 1000, 400, 1000, 400, 1000, 400];

// ---- State ----
var state = {
  deviceId: '',
  lastSeq: 0,
  polling: false,
  pollTimer: null,
  heartbeatTimer: null,
  callCount: 0,
  incomingCall: null,    // { callerName, callId, seq }
  peer: null,            // PeerJS instance for outgoing call
  activeCall: null,      // active MediaConnection
  localStream: null,
  remoteStream: null,
  audioCtx: null,        // Web Audio API context for ringtone
  masterGain: null,      // master GainNode (max volume)
  ringtoneTimer: null,   // setInterval handle for ringtone loop
  callStartTs: 0,
  callTimerHandle: null,
  muted: false,
};

// ---- DOM helpers ----
function $(id) { return document.getElementById(id); }

function showScreen(name) {
  ['login', 'idle', 'incall'].forEach(function(s) {
    var el = $('screen-' + s);
    if (el) el.classList.toggle('sc-active', s === name);
  });
}

function showToast(msg, kind) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast';
  if (kind) t.classList.add('sc-' + kind);
  // force reflow so animation restarts
  void t.offsetWidth;
  t.classList.add('sc-show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(function() {
    t.classList.remove('sc-show');
  }, 3000);
}

// ===================================================================
// RINGTONE — Web Audio API synthesized iPhone-Marimba-style loop
// Plays a pleasant arpeggio that loops every ~3 seconds.
// MAX VOLUME: master GainNode at 1.0 + DynamicsCompressor to prevent clipping.
// ===================================================================
function ensureAudioCtx() {
  if (!state.audioCtx) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      state.audioCtx = new AC();
    } catch (e) {
      console.warn('[POAT] Web Audio API not supported:', e.message);
      return null;
    }
  }
  // Resume if suspended (mobile browsers require user gesture)
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume().catch(function(){});
  }
  return state.audioCtx;
}

// Get (or lazily create) a master GainNode + DynamicsCompressor chain
// connected to ctx.destination. All oscillators route through this so we can
// maximize perceived loudness without clipping.
function getMasterBus(ctx) {
  if (state.masterGain && state.masterGain.ctx === ctx) {
    return state.masterGain;
  }
  // Master gain — pushed ABOVE unity (1.0) for max loudness. The compressor
  // downstream will tame any clipping.
  var master = ctx.createGain();
  master.gain.value = 1.0;

  // Compressor — aggressive limiter to prevent clipping while keeping
  // perceived loudness very high.
  var comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -10;
  comp.knee.value = 0;
  comp.ratio.value = 20;
  comp.attack.value = 0.003;
  comp.release.value = 0.25;

  master.connect(comp);
  comp.connect(ctx.destination);

  state.masterGain = master;
  state.masterGain.ctx = ctx; // remember which ctx it belongs to
  return master;
}

// Play a single marimba-like note with envelope — louder than before (0.6 peak)
function playNote(ctx, freq, startTime, duration, gainPeak) {
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  // Marimba-like envelope: fast attack, exponential decay
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(gainPeak || 0.6, startTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain);
  gain.connect(getMasterBus(ctx));
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}

// Schedule one ringtone "phrase" (~3.2 seconds long)
function playRingtonePhrase(ctx) {
  var now = ctx.currentTime + 0.01;
  // iPhone-Marimba-inspired descending-then-ascending arpeggio in A-minor
  var notes = [
    { f: 440.00, t: 0.00, d: 0.30 }, // A4
    { f: 523.25, t: 0.30, d: 0.30 }, // C5
    { f: 659.25, t: 0.60, d: 0.30 }, // E5
    { f: 880.00, t: 0.90, d: 0.45 }, // A5 (longer, accented)
    { f: 659.25, t: 1.45, d: 0.25 }, // E5
    { f: 523.25, t: 1.70, d: 0.25 }, // C5
    { f: 440.00, t: 1.95, d: 0.50 }, // A4 (longer closing)
  ];
  notes.forEach(function(n) {
    playNote(ctx, n.f, now + n.t, n.d, 0.6);
  });
  // Add a higher harmonic on the accented note for richness (extra loudness)
  playNote(ctx, 1760, now + 0.90, 0.30, 0.25);
  // Total phrase length ≈ 2.55s + silence ≈ 3.2s
  return 3200;
}

function startRingtone() {
  var ctx = ensureAudioCtx();
  if (!ctx) return;
  // Play immediately
  var phraseLen = playRingtonePhrase(ctx);
  // Loop
  state.ringtoneTimer = setInterval(function() {
    try { playRingtonePhrase(ctx); } catch(e) { console.warn(e); }
  }, phraseLen);
}

function stopRingtone() {
  if (state.ringtoneTimer) {
    clearInterval(state.ringtoneTimer);
    state.ringtoneTimer = null;
  }
  // Close audio context to cut any remaining sound immediately
  if (state.audioCtx) {
    try { state.audioCtx.close(); } catch(e) {}
    state.audioCtx = null;
    state.masterGain = null;
  }
}

// ===================================================================
// VIBRATION — uses navigator.vibrate with a single LONG pattern
// (looping short patterns cancels itself because each new navigator.vibrate()
// call cancels the previous one).
// ===================================================================
function startVibration() {
  if (!navigator.vibrate) {
    console.warn('[POAT] navigator.vibrate not supported on this browser');
    return;
  }
  // Build a long vibration pattern that lasts ~30 seconds:
  // vibrate 1000ms, pause 500ms, repeat 20 times = 30,000ms total
  var pattern = [0];
  for (var i = 0; i < 20; i++) {
    pattern.push(1000); // vibrate
    pattern.push(500);  // pause
  }
  // Total ≈ 30s. navigator.vibrate() plays the whole pattern as one shot.
  try {
    var ok = navigator.vibrate(pattern);
    console.log('[POAT] vibrate started, returned:', ok);
  } catch(e) {
    console.warn('[POAT] vibrate failed:', e.message);
  }
  // Re-trigger every 28 seconds in case the call is still ringing after the
  // first 30-second pattern finishes.
  state._vibrateTimer = setInterval(function() {
    if ($('incoming-overlay').classList.contains('sc-open')) {
      try { navigator.vibrate(pattern); } catch(e) {}
    } else {
      clearInterval(state._vibrateTimer);
      state._vibrateTimer = null;
    }
  }, 28000);
}

function stopVibration() {
  if (state._vibrateTimer) {
    clearInterval(state._vibrateTimer);
    state._vibrateTimer = null;
  }
  if (navigator.vibrate) {
    try { navigator.vibrate(0); } catch(e) {}
  }
}

// ===================================================================
// LOGIN
// ===================================================================
function handleLogin() {
  var deviceId = $('login-device-id').value.trim();

  // Hardcoded credential check — only Poat001 is accepted
  if (deviceId !== 'Poat001') {
    showToast('Wrong Credentials', 'err');
    return;
  }

  state.deviceId = deviceId;
  state.lastSeq = Date.now(); // only receive commands issued AFTER login

  // Save to localStorage for convenience
  try {
    localStorage.setItem('poat-device-id', deviceId);
  } catch(e) {}

  // Register this dashboard with the backend by POSTing to /api/status.
  registerDevice().then(function() {
    showToast('Connected — listening', 'ok');
    enterIdle();
    startPolling();
    startHeartbeat();
  }).catch(function(err) {
    showToast('Connection failed: ' + err.message, 'err');
  });
}

// Register / heartbeat — tells the backend we're alive and listening
function registerDevice() {
  return fetch(BACKEND_URL + '/api/status', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      deviceId: state.deviceId,
      source: 'poat_dashboard',
      platform: navigator.userAgent.substring(0, 100),
    })
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function startHeartbeat() {
  if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);
  state.heartbeatTimer = setInterval(function() {
    registerDevice().catch(function(err) {
      console.warn('[POAT] heartbeat failed:', err.message);
    });
  }, HEARTBEAT_INTERVAL_MS);
}

function stopHeartbeat() {
  if (state.heartbeatTimer) {
    clearInterval(state.heartbeatTimer);
    state.heartbeatTimer = null;
  }
}

function handleLogout() {
  stopPolling();
  stopHeartbeat();
  stopRingtone();
  stopVibration();
  if (state.peer) { try { state.peer.destroy(); } catch(e) {} state.peer = null; }
  if (state.activeCall) { try { state.activeCall.close(); } catch(e) {} state.activeCall = null; }
  if (state.localStream) {
    state.localStream.getTracks().forEach(function(t) { try { t.stop(); } catch(e){} });
    state.localStream = null;
  }
  state.deviceId = '';
  try {
    localStorage.removeItem('poat-device-id');
  } catch(e) {}
  showScreen('login');
}

// ===================================================================
// IDLE / POLLING
// ===================================================================
function enterIdle() {
  showScreen('idle');
  $('idle-device-id').textContent = state.deviceId;
  $('idle-call-count').textContent = state.callCount;
}

function startPolling() {
  if (state.polling) return;
  state.polling = true;
  // Immediate first poll
  doPoll();
  // Schedule recurring
  state.pollTimer = setInterval(doPoll, POLL_INTERVAL_MS);
}

function stopPolling() {
  state.polling = false;
  if (state.pollTimer) {
    clearInterval(state.pollTimer);
    state.pollTimer = null;
  }
}

function doPoll() {
  if (!state.deviceId) return;
  var url = BACKEND_URL + '/api/poll?deviceId=' + encodeURIComponent(state.deviceId)
          + '&lastSeq=' + encodeURIComponent(state.lastSeq);

  // Abort after POLL_TIMEOUT_MS
  var controller = null;
  var timeoutId = null;
  if (window.AbortController) {
    controller = new AbortController();
    timeoutId = setTimeout(function() { controller.abort(); }, POLL_TIMEOUT_MS);
  }

  fetch(url, { signal: controller ? controller.signal : undefined })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (timeoutId) clearTimeout(timeoutId);
      var now = new Date();
      $('idle-last-poll').textContent = now.toLocaleTimeString();
      if (data.commands && data.commands.length > 0) {
        data.commands.forEach(function(cmd) {
          if (cmd.seq > state.lastSeq) state.lastSeq = cmd.seq;
          handleCommand(cmd);
        });
      }
    })
    .catch(function(err) {
      if (timeoutId) clearTimeout(timeoutId);
      // Don't spam toasts on every poll failure
      console.warn('[POAT] poll failed:', err.message);
      $('idle-last-poll').textContent = 'error';
    });
}

function handleCommand(cmd) {
  console.log('[POAT] received command:', cmd);
  if (cmd.type === 'show_call') {
    state.callCount++;
    $('idle-call-count').textContent = state.callCount;
    showIncomingCall({
      callerName: cmd.payload.callerName || 'Website Caller',
      callId: cmd.payload.callId || ('emg_' + Date.now()),
      seq: cmd.seq
    });
  }
}

// ===================================================================
// INCOMING CALL OVERLAY
// ===================================================================
function showIncomingCall(call) {
  // If we're already in a call, ignore subsequent incoming calls
  if ($('screen-incall').classList.contains('sc-active')) {
    console.log('[POAT] already in call, ignoring incoming');
    return;
  }
  // If overlay already open for a previous call, decline it first
  if ($('incoming-overlay').classList.contains('sc-open')) {
    declineIncomingCall();
  }

  state.incomingCall = call;
  $('incoming-caller-name').textContent = call.callerName;
  $('incoming-overlay').classList.add('sc-open');

  // Prime audio context on this user gesture chain — actually overlay shown
  // automatically; for mobile audio to play, we need a user gesture. We'll
  // attempt to start the ringtone now (may be blocked on first call until
  // user taps anywhere). To work around, we attach a one-time tap listener.
  ensureAudioCtx();
  startRingtone();
  startVibration();

  // Mobile fallback: if audio is blocked, the first tap on Answer/Decline
  // will resume the audio context (and we'll briefly play the ringtone even
  // then). The act of pressing Answer also satisfies the user-gesture
  // requirement for getUserMedia.
}

function hideIncomingCall() {
  $('incoming-overlay').classList.remove('sc-open');
  stopRingtone();
  stopVibration();
  state.incomingCall = null;
}

function answerIncomingCall() {
  if (!state.incomingCall) {
    hideIncomingCall();
    return;
  }
  var call = state.incomingCall;
  hideIncomingCall();

  // 1) Get microphone
  navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    .then(function(stream) {
      state.localStream = stream;
      // 2) Open PeerJS — we'll be the CALLER (dialing the website visitor's peerId = callId)
      connectPeerAndDial(call.callId, call.callerName);
    })
    .catch(function(err) {
      console.error('[POAT] getUserMedia failed:', err);
      showToast('Microphone access denied: ' + err.message, 'err');
      // Return to idle
      showScreen('idle');
    });
}

function declineIncomingCall() {
  hideIncomingCall();
  showToast('Call declined');
  // Stay on idle screen
  if (!$('screen-incall').classList.contains('sc-active')) {
    showScreen('idle');
  }
}

// ===================================================================
// PEERJS — dial the website visitor (who is hosting with callId as peerId)
// ===================================================================
function connectPeerAndDial(remotePeerId, callerName) {
  showScreen('incall');
  $('incall-caller').textContent = callerName || 'Website Caller';
  $('incall-status').textContent = 'Connecting…';
  $('incall-timer').textContent = '00:00';

  // Create a Peer with a random ID (we're the caller)
  try {
    state.peer = new Peer({ debug: 1 });
  } catch(e) {
    showToast('PeerJS init failed: ' + e.message, 'err');
    hangupCall();
    return;
  }

  state.peer.on('open', function() {
    console.log('[POAT] peer open, dialing remote:', remotePeerId);
    $('incall-status').textContent = 'Ringing…';
    try {
      state.activeCall = state.peer.call(remotePeerId, state.localStream);
    } catch(e) {
      showToast('Failed to place call: ' + e.message, 'err');
      hangupCall();
      return;
    }
    if (!state.activeCall) {
      showToast('Could not place call (peer.call returned null)', 'err');
      hangupCall();
      return;
    }
    state.activeCall.on('stream', function(remoteStream) {
      console.log('[POAT] remote stream received');
      playRemoteStream(remoteStream);
      $('incall-status').textContent = 'Connected';
      startCallTimer();
    });
    state.activeCall.on('close', function() {
      console.log('[POAT] remote closed the call');
      hangupCall();
    });
    state.activeCall.on('error', function(e) {
      console.error('[POAT] call error:', e);
      showToast('Call error: ' + (e.message || e), 'err');
      hangupCall();
    });
  });

  state.peer.on('error', function(err) {
    console.error('[POAT] peer error:', err);
    var msg = err && err.type ? err.type : (err && err.message ? err.message : String(err));
    if (msg === 'peer-unavailable') {
      showToast('Caller not online / call ID not found', 'err');
    } else if (msg === 'network' || msg === 'server-error' || msg === 'socket-error') {
      showToast('Network issue', 'err');
    } else {
      showToast('Error: ' + msg, 'err');
    }
    hangupCall();
  });
}

function playRemoteStream(stream) {
  var audio = $('remote-audio');
  audio.srcObject = stream;
  // Force speaker route by default (more useful for receiving an emergency call)
  audio.setSinkId && audio.setSinkId('default').catch(function(){});
  var p = audio.play();
  if (p && p.then) {
    p.then(function() {
      console.log('[POAT] remote audio playing');
    }).catch(function(e) {
      console.warn('[POAT] remote audio play() rejected:', e.message);
      // Try again on next user interaction
      var retry = function() {
        audio.play().catch(function(){});
        document.removeEventListener('click', retry);
        document.removeEventListener('touchstart', retry);
      };
      document.addEventListener('click', retry);
      document.addEventListener('touchstart', retry);
    });
  }
  state.remoteStream = stream;
}

function hangupCall() {
  stopCallTimer();
  if (state.activeCall) {
    try { state.activeCall.close(); } catch(e) {}
    state.activeCall = null;
  }
  if (state.peer) {
    try { state.peer.destroy(); } catch(e) {}
    state.peer = null;
  }
  if (state.localStream) {
    state.localStream.getTracks().forEach(function(t) { try { t.stop(); } catch(e){} });
    state.localStream = null;
  }
  var audio = $('remote-audio');
  if (audio) {
    try { audio.pause(); } catch(e){}
    audio.srcObject = null;
  }
  state.muted = false;
  $('btn-mute').classList.remove('sc-active');
  $('btn-mute').querySelector('i').className = 'fas fa-microphone';
  showScreen('idle');
  showToast('Call ended');
}

function startCallTimer() {
  state.callStartTs = Date.now();
  state.callTimerHandle = setInterval(function() {
    var elapsed = Math.floor((Date.now() - state.callStartTs) / 1000);
    var m = Math.floor(elapsed / 60).toString().padStart(2, '0');
    var s = (elapsed % 60).toString().padStart(2, '0');
    $('incall-timer').textContent = m + ':' + s;
  }, 1000);
}

function stopCallTimer() {
  if (state.callTimerHandle) {
    clearInterval(state.callTimerHandle);
    state.callTimerHandle = null;
  }
}

function toggleMute() {
  if (!state.localStream) return;
  state.muted = !state.muted;
  state.localStream.getAudioTracks().forEach(function(t) { t.enabled = !state.muted; });
  var btn = $('btn-mute');
  btn.classList.toggle('sc-active', state.muted);
  btn.querySelector('i').className = state.muted ? 'fas fa-microphone-slash' : 'fas fa-microphone';
  btn.querySelector('span').textContent = state.muted ? 'Unmute' : 'Mute';
}

function toggleSpeaker() {
  // On most mobile browsers we can't truly toggle earpiece vs speaker via JS,
  // but we can try to setSinkId on supported browsers.
  var audio = $('remote-audio');
  if (!audio || !audio.setSinkId) {
    showToast('Speaker toggle not supported on this browser');
    return;
  }
  var btn = $('btn-speaker');
  var isOn = btn.classList.toggle('sc-active');
  audio.setSinkId(isOn ? 'speaker' : 'default').catch(function(e){
    console.warn('[POAT] setSinkId failed:', e);
  });
}

// ===================================================================
// TEST RINGTONE (idle screen)
// ===================================================================
function handleTestRingtone() {
  ensureAudioCtx();
  startRingtone();
  startVibration();
  showToast('Test ringing — stops in 5s', 'ok');
  setTimeout(function() {
    stopRingtone();
    stopVibration();
  }, 5000);
}

// ===================================================================
// EVENT WIRING
// ===================================================================
function bindEvents() {
  $('btn-login').addEventListener('click', handleLogin);
  $('btn-logout').addEventListener('click', handleLogout);
  $('btn-test-call').addEventListener('click', handleTestRingtone);
  $('btn-hangup').addEventListener('click', hangupCall);
  $('btn-mute').addEventListener('click', toggleMute);
  $('btn-speaker').addEventListener('click', toggleSpeaker);
  $('action-answer').addEventListener('click', answerIncomingCall);
  $('action-decline').addEventListener('click', declineIncomingCall);

  // Allow Enter key in login inputs to submit
  ['login-device-id'].forEach(function(id) {
    $(id).addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.keyCode === 13) handleLogin();
    });
  });

  // Resume audio context on first user interaction (mobile requirement)
  function primeAudio() {
    ensureAudioCtx();
  }
  document.addEventListener('click', primeAudio, { once: true });
  document.addEventListener('touchstart', primeAudio, { once: true });

  // Handle page visibility — pause aggressive polling when hidden to save battery,
  // but resume immediately when visible again.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      if (state.deviceId && !state.polling) {
        startPolling();
      }
    } else {
      // When hidden, keep polling but maybe slower (still need to detect calls)
      // For now, keep same rate
    }
  });
}

// ===================================================================
// INIT
// ===================================================================
function init() {
  bindEvents();
  // Prefill from localStorage
  try {
    var di = localStorage.getItem('poat-device-id');
    if (di) $('login-device-id').value = di;
  } catch(e) {}
  // Register a Service Worker for future PWA support (optional, ignore if it fails)
  if ('serviceWorker' in navigator) {
    // Skip for now — no sw.js file
  }
}

init();
</script>
